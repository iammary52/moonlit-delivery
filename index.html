<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111710">
  <meta name="description" content="장난감 숲을 달리는 두 배달원의 로컬 협동 액션 게임">
  <title>달빛 특송 · Moonlit Delivery</title>
  <link rel="stylesheet" href="style.css?v=4">
  <script src="art.js?v=4" defer></script>
  <script src="game.js?v=4" defer></script>
</head>
<body>
<header class="top shell">
  <a class="brand" href="./" aria-label="달빛 특송 처음 화면"><span class="mark">✦</span><span>달빛 특송<small>MOONLIT DELIVERY</small></span></a>
  <div class="tools"><span id="padStatus" aria-live="polite">패드 · 0대</span><button id="sound" type="button" aria-pressed="true">소리 켜짐</button><button id="fullscreen" type="button">전체 화면</button></div>
</header>
<main class="shell">
  <section id="stage" aria-label="달빛 특송 게임">
    <canvas id="game" width="1440" height="810" aria-label="두 배달원과 슬라임이 등장하는 게임 화면"></canvas>
    <div id="hud" hidden>
      <div class="life" id="life1"></div>
      <div class="mission"><span id="chapter"></span><strong id="wave"></strong><span id="remaining"></span><div id="feverMeter"><i id="feverFill"></i><span id="feverLabel"></span></div><span id="companionLevel"></span></div>
      <div class="life right" id="life2"></div>
    </div>
    <div id="notice" aria-live="polite" hidden></div>
    <div id="menu" class="overlay">
      <div class="title-screen">
        <p class="subtitle"><span>✦</span> MOONLIT DELIVERY <span>✦</span></p>
        <h1>달빛 특송</h1>
        <p class="tagline">장난감 숲을 달리는 두 배달원의 모험</p>
        <button id="openSelect" class="primary">배달원 고르기 <b>↗</b></button>
        <p class="caption">한 화면에서 2인 협동 · 키보드 / Xbox 패드</p>
      </div>
    </div>
    <div id="select" class="overlay panel-shade" hidden>
      <div class="panel selection">
        <h2>배달원 고르기</h2>
        <div class="slots">
          <button class="slot" id="slot1" aria-pressed="true">1P</button>
          <button class="slot" id="slot2" aria-pressed="false">2P</button>
        </div>
        <div id="roster"></div>
        <label class="single-pad"><input id="padForOne" type="checkbox"> 패드가 한 대면 1P에 연결</label>
        <div class="actions"><button id="selectBack">뒤로</button><button id="continueGame" hidden>이어하기</button><button id="startGame" class="primary">새 배달 시작 <b>→</b></button></div>
      </div>
    </div>
    <div id="interlude" class="overlay panel-shade" hidden>
      <div class="panel break">
        <p id="breakLabel" class="subtitle"></p>
        <h2 id="breakTitle"></h2>
        <p id="breakText"></p>
        <div class="actions"><button id="backToMenu">첫 화면</button><button id="next" class="primary"></button></div>
      </div>
    </div>
  </section>
  <section class="guide" aria-label="조작법">
    <div><span class="control-label one">1P</span><kbd>W A S D</kbd> 이동 <kbd>F</kbd> 공격 <kbd>G</kbd> 회피</div>
    <div><span class="control-label two">2P</span><kbd>↑ ↓ ← →</kbd> 이동 <kbd>K</kbd> 공격 <kbd>L</kbd> 회피</div>
    <div><span class="control-label">XBOX</span> 왼쪽 스틱 이동 <kbd>X</kbd> 공격 <kbd>A</kbd> 회피</div>
  </section>
  <footer><span>공격을 누르고 있으면 적을 자동으로 조준해요.</span><span>일시정지 <kbd>Esc</kbd> / <kbd>☰</kbd></span></footer>
</main>
</body>
</html>
